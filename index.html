e: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.68 0.014 60);\">06<\u002Fspan><span style=\"font-size: 14.5px; color: oklch(0.6 0.014 60);\">Transformers and Modern Architectures<\u002Fspan><\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.7 0.014 60); white-space: nowrap; padding-top: 3px;\">Upcoming<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 34px 0; border-top: 2px solid oklch(0.55 0.12 60 / 0.4);\">\n          <div style=\"display: flex; justify-content: space-between; gap: 28px; align-items: baseline;\">\n            <h3 style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-weight: 400; font-size: 25px; line-height: 1.25; margin: 0;\">Retrieval Augmented Generation<\u002Fh3>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60); white-space: nowrap;\">38% complete<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 10px 0 0;\">DeepLearning.AI · short course · started Aug 2026<\u002Fp>\n          <div style=\"height: 3px; background: oklch(0.9 0.012 84); margin: 18px 0 22px; max-width: 60ch;\"><div style=\"height: 3px; width: 38%; background: oklch(0.55 0.12 60);\"><\u002Fdiv><\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.8; color: oklch(0.44 0.014 60); margin: 0 0 22px; max-width: 60ch;\">Taken specifically to sharpen the local RAG assistant — chunking strategy, embedding choice, and how to actually evaluate retrieval instead of eyeballing the answers.<\u002Fp>\n          <div style=\"max-width: 62ch;\">\n            <div style=\"display: flex; justify-content: space-between; gap: 24px; padding: 13px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n              <span style=\"display: flex; gap: 18px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.68 0.014 60);\">01<\u002Fspan><span style=\"font-size: 14.5px; color: oklch(0.3 0.014 60);\">Retrieval Fundamentals and Chunking Strategy<\u002Fspan><\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60); white-space: nowrap; padding-top: 3px;\">Complete<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; gap: 24px; padding: 13px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n              <span style=\"display: flex; gap: 18px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.68 0.014 60);\">02<\u002Fspan><span style=\"font-size: 14.5px; color: oklch(0.6 0.014 60);\">Embeddings and Vector Search<\u002Fspan><\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.7 0.014 60); white-space: nowrap; padding-top: 3px;\">In progress<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; gap: 24px; padding: 13px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n              <span style=\"display: flex; gap: 18px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.68 0.014 60);\">03<\u002Fspan><span style=\"font-size: 14.5px; color: oklch(0.6 0.014 60);\">Re-ranking and Retrieval Evaluation<\u002Fspan><\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.7 0.014 60); white-space: nowrap; padding-top: 3px;\">Upcoming<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; gap: 24px; padding: 13px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n              <span style=\"display: flex; gap: 18px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.68 0.014 60);\">04<\u002Fspan><span style=\"font-size: 14.5px; color: oklch(0.6 0.014 60);\">Building a Production RAG Pipeline<\u002Fspan><\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.7 0.014 60); white-space: nowrap; padding-top: 3px;\">Upcoming<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section id=\"program\" data-screen-label=\"AI program\" style=\"max-width: 1080px; margin: 0 auto; padding: 160px 0 0;\">\n    <div style=\"height: 1px; background: oklch(0.88 0.012 84); margin: 0 0 130px;\"><\u002Fdiv>\n    <div data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1.6fr; gap: 72px; align-items: start;\">\n      <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 21px; line-height: 1.35; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.45 0.02 60); margin: 0; text-align: center; position: sticky; top: 120px;\">Applied AI program<\u002Fp>\n      <div>\n        <p style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 23px; line-height: 1.5; color: oklch(0.32 0.014 60); margin: 0 0 24px; max-width: 42ch; text-wrap: pretty;\">Six courses, forty-three builds. Core taught me to train and evaluate models, Agentic to orchestrate them, Production to run them on real infrastructure.<\u002Fp>\n        <p style=\"font-size: 15.5px; line-height: 1.8; color: oklch(0.44 0.014 60); margin: 0 0 56px; max-width: 60ch;\">Ed Donner's AI curriculum. Each track below opens to the projects it produced and the techniques behind them.<\u002Fp>\n      <details open=\"\" style=\"border-top: 2px solid oklch(0.55 0.12 60 / 0.4);\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 28px; padding: 26px 0;\">\n          <span style=\"display: flex; gap: 20px; align-items: baseline;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: oklch(0.6 0.014 60);\">01<\u002Fspan>\n            <span>\n              <span style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 26px; display: block; margin: 0 0 6px;\">AI Engineer — Core Track<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60);\">8 projects · culminates in fine-tuning<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fspan>\n          <span data-plus=\"\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; color: oklch(0.55 0.12 60); line-height: 1;\"><\u002Fspan>\n        <\u002Fsummary>\n        <div style=\"padding: 0 0 40px 32px;\">\n          <p style=\"font-size: 15.5px; line-height: 1.8; color: oklch(0.38 0.014 60); margin: 0 0 8px; max-width: 62ch;\">Select, train and evaluate models. Prompting and chained calls through retrieval, then data curation and a QLoRA fine-tune that beat frontier models on a narrow task.<\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.7; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0 0 12px; max-width: 62ch;\">          <\u002Fp><div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Company brochure generator<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Chained LLM calls — one returns relevant links as JSON, a second writes the brochure. OpenAI Chat Completions, system/user prompting, structured JSON output, streaming, requests + BeautifulSoup scraping.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Multi-modal airline support assistant<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Gradio chatbot with tool/function calling — tool schema, the call/return loop, multi-shot prompting, DALL-E image generation and text-to-speech.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Meeting-minutes generator<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Two-stage audio pipeline: Whisper transcription on a Colab GPU, then a frontier model with a structure-forcing prompt. Open-source and closed models in one workflow.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Python → C++ code optimizer<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Gradio UI comparing frontier and open-source coding models (Qwen Coder, DeepSeek, GPT-OSS via OpenRouter), then compiling and timing output to verify speedups on compute-bound code.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">RAG knowledge worker<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">First full retrieval pipeline — LangChain loaders and splitters, OpenAI embeddings, Chroma vector store, retriever-plus-LLM chain, t-SNE to inspect the embedding space.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Price prediction with frontier models<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Data curation on a large messy Amazon dataset, a proper held-out test set, scikit-learn baselines (bag-of-words regression, random forest) and a human baseline, then zero-shot frontier evaluation.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Fine-tuned open-source price model<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">QLoRA fine-tune of LLaMA 3.2 — 4-bit base, LoRA rank/alpha/target-module tuning, TRL SFTTrainer on a Colab A100, Weights &amp; Biases for loss tracking and checkpoint selection. Beat the frontier models on the narrow task.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Autonomous deal-finding system<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Ensemble of a RAG lookup, the fine-tuned model and a frontier model, behind an agent planning loop. Pydantic structured outputs, Modal for scheduled serverless deployment, Pushover alerts.<\u002Fp>\n          <\u002Fdiv>\n<p><\u002Fp>\nLLM engineering · RAG · QLoRA · evaluation        <\u002Fdiv>\n      <\u002Fdetails>\n      <details style=\"border-top: 2px solid oklch(0.55 0.12 60 / 0.4);\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 28px; padding: 26px 0;\">\n          <span style=\"display: flex; gap: 20px; align-items: baseline;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: oklch(0.6 0.014 60);\">02<\u002Fspan>\n            <span>\n              <span style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 26px; display: block; margin: 0 0 6px;\">AI Engineer — Agentic Track<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60);\">8 projects · culminates in MCP<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fspan>\n          <span data-plus=\"\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; color: oklch(0.55 0.12 60); line-height: 1;\"><\u002Fspan>\n        <\u002Fsummary>\n        <div style=\"padding: 0 0 40px 32px;\">\n          <p style=\"font-size: 15.5px; line-height: 1.8; color: oklch(0.38 0.014 60); margin: 0 0 8px; max-width: 62ch;\">Orchestrate agents and tools across five frameworks — hand-rolled loops, OpenAI Agents SDK, CrewAI, LangGraph and AutoGen — ending in a deep MCP build.<\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.7; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0 0 12px; max-width: 62ch;\">          <\u002Fp><div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Digital Twin agent<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">The agent loop written from scratch — a while-loop that detects tool-call requests, executes, and feeds results back. Gradio UI, Pushover tools, deployed to Hugging Face Spaces.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Multi-agent sales team<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">OpenAI Agents SDK — Agent, Runner, tracing, @function_tool, SQLiteSession memory, and all three orchestration patterns: asyncio parallelism, agents-as-tools under a manager, and handoffs. Plus guardrails.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Deep Research agent<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Planner designs queries, parallel search agents gather, a writer synthesizes a cited report. Hosted web search, code-level parallel orchestration, structured plans, deployed UI.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Stock Picker crew<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">CrewAI declaratively — agents, tasks and crews in YAML, Serper search, custom tools, crew memory, the hierarchical manager process, Pydantic output schemas.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Engineering team crew<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">A crew of coding agents writing and testing modules with code execution sandboxed in Docker. Custom sandbox tools, multiple LLM backends, UV for dependency management.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Sidekick / Operator agent<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">LangGraph state, nodes, edges and reducers driving a real browser via Playwright through MCP. Human-in-the-loop interrupts, MemorySaver/SQLite memory, an evaluator node judging task success.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Agent Creator<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">An AutoGen agent that generates and launches other agents, alongside comparative work in Google ADK, Agno and Mastra — the same agent loop under different ergonomics.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Capstone: Trading Floor (MCP)<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Four agents making autonomous paper trades over 6 MCP servers exposing 44 tools. Built my own server with FastMCP, used the researcher-as-a-tool pattern, added observability and evaluation, FastAPI backend and React dashboard.<\u002Fp>\n          <\u002Fdiv>\n<p><\u002Fp>\nAgent orchestration · tool use · MCP        <\u002Fdiv>\n      <\u002Fdetails>\n      <details style=\"border-top: 2px solid oklch(0.55 0.12 60 / 0.4);\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 28px; padding: 26px 0;\">\n          <span style=\"display: flex; gap: 20px; align-items: baseline;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: oklch(0.6 0.014 60);\">03<\u002Fspan>\n            <span>\n              <span style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 26px; display: block; margin: 0 0 6px;\">AI Engineer — Production Track<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60);\">4 projects · culminates in AWS multi-agent<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fspan>\n          <span data-plus=\"\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; color: oklch(0.55 0.12 60); line-height: 1;\"><\u002Fspan>\n        <\u002Fsummary>\n        <div style=\"padding: 0 0 40px 32px;\">\n          <p style=\"font-size: 15.5px; line-height: 1.8; color: oklch(0.38 0.014 60); margin: 0 0 8px; max-width: 62ch;\">Deploy and operate on real cloud infrastructure. Containers, IaC, CI/CD, managed inference, queues, observability and the security concerns the other tracks skip.<\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.7; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0 0 12px; max-width: 62ch;\">          <\u002Fp><div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">SaaS Healthcare App<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Full-stack AI SaaS taken live — Next.js frontend, FastAPI backend, Clerk auth and subscriptions, Dockerized, deployed to Vercel then migrated to AWS App Runner.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Digital Twin Mk II — serverless AWS<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">The agent as infrastructure: Lambda, Bedrock managed inference, API Gateway, S3, CloudFront, Route 53. Terraform for IaC and GitHub Actions CI/CD so a push redeploys. Cloud-backed conversational memory.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Cybersecurity analyst + ALEX financial system<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Multi-cloud deployment across AWS, Azure Container Apps and GCP. MCP servers wrapping Semgrep for real static-analysis grounding, SageMaker for self-hosted inference, S3-based vector storage for RAG.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Capstone: SaaS Financial Planner<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Fully agentic system on AWS — Aurora Serverless, Lambda and SQS wiring agents asynchronously via queues, Bedrock AgentCore hosting, LangFuse tracing, CloudWatch monitoring, guardrails and prompt-injection defence.<\u002Fp>\n          <\u002Fdiv>\n<p><\u002Fp>\nAWS · Terraform · Bedrock · observability        <\u002Fdiv>\n      <\u002Fdetails>\n      <details style=\"border-top: 2px solid oklch(0.55 0.12 60 / 0.4);\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 28px; padding: 26px 0;\">\n          <span style=\"display: flex; gap: 20px; align-items: baseline;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: oklch(0.6 0.014 60);\">04<\u002Fspan>\n            <span>\n              <span style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 26px; display: block; margin: 0 0 6px;\">AI Builder<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60);\">16 builds · no-code integration<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fspan>\n          <span data-plus=\"\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; color: oklch(0.55 0.12 60); line-height: 1;\"><\u002Fspan>\n        <\u002Fsummary>\n        <div style=\"padding: 0 0 40px 32px;\">\n          <p style=\"font-size: 15.5px; line-height: 1.8; color: oklch(0.38 0.014 60); margin: 0 0 8px; max-width: 62ch;\">Visual workflow engineering in n8n — triggers, nodes and expressions wiring services together, plus voice agents and the no-code counterpart to RAG and MCP.<\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.7; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0 0 12px; max-width: 62ch;\">          <\u002Fp><div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Integrations and automations<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Sixteen workflows across Google Sheets/Drive, Gmail auto-drafting, Telegram and Slack bots, a scheduled stock tracker and portfolio rebalancer. OAuth2, webhooks, HTTP nodes and expression-based JSON handling.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Voice agents on real phone lines<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">ElevenLabs conversational agents deployed as widgets, connected to n8n backends by webhook, then routed to a purchased Twilio number so the agent answers actual calls.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">No-code RAG and MCP<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">PDF extraction, chunking and OpenAI embeddings into a Supabase vector store, then wired into a RAG-powered voice agent. Also exposed an n8n workflow as a custom MCP server consumed by an external Claude client.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Self-hosted stack<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">n8n in Docker with Ollama running local DeepSeek and Llama models instead of cloud APIs — and the trade-offs that come with it.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Capstone: go-to-market system<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Autonomous lead discovery, enrichment, CRM creation and nurture — FireCrawl and Tavily MCP servers, Hunter for emails, Pipedrive, Google Calendar demo booking, and a voice-agent CRM workflow.<\u002Fp>\n          <\u002Fdiv>\n<p><\u002Fp>\nn8n · webhooks · OAuth · Supabase · Twilio        <\u002Fdiv>\n      <\u002Fdetails>\n      <details style=\"border-top: 2px solid oklch(0.55 0.12 60 / 0.4);\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 28px; padding: 26px 0;\">\n          <span style=\"display: flex; gap: 20px; align-items: baseline;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: oklch(0.6 0.014 60);\">05<\u002Fspan>\n            <span>\n              <span style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 26px; display: block; margin: 0 0 6px;\">AI Coder<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60);\">7 builds · directing coding agents<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fspan>\n          <span data-plus=\"\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; color: oklch(0.55 0.12 60); line-height: 1;\"><\u002Fspan>\n        <\u002Fsummary>\n        <div style=\"padding: 0 0 40px 32px;\">\n          <p style=\"font-size: 15.5px; line-height: 1.8; color: oklch(0.38 0.014 60); margin: 0 0 8px; max-width: 62ch;\">The inverted course: mostly not writing code but directing it. Context management, ticket decomposition, review, and orchestrating agent swarms.<\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.7; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0 0 12px; max-width: 62ch;\">          <\u002Fp><div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Agentic engineering workflow<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Directing Claude Code, Cursor, Copilot and Codex — context management in CLAUDE.md and custom Skills, decomposition into tickets, and reviewing agent output. Built the same Kanban app four ways as an explicit head-to-head.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">SaaS legal document generator<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">A real SaaS that drafts consulting agreements and exports PDFs, built through a proper dev process: Jira tickets picked up by Claude Code, code written, tested, and opened as a PR. MCP servers bridging Claude Code to Jira and GitHub, FastAPI backend, Cerebras inference.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Capstone: real-time trading workstation<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">Multi-agent trading app with a live market-data dashboard and an AI strategy assistant — scaled with Claude Code Agent Teams running parallel frontend and backend agents, spec-driven orchestration, event hooks, cloud sandboxes and the Agent SDK.<\u002Fp>\n          <\u002Fdiv>\n<p><\u002Fp>\nClaude Code · Cursor · agent orchestration        <\u002Fdiv>\n      <\u002Fdetails>\n      <details style=\"border-top: 2px solid oklch(0.55 0.12 60 / 0.4);\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 28px; padding: 26px 0;\">\n          <span style=\"display: flex; gap: 20px; align-items: baseline;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: oklch(0.6 0.014 60);\">06<\u002Fspan>\n            <span>\n              <span style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 26px; display: block; margin: 0 0 6px;\">AI Leader<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60);\">Strategy briefing · no builds<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fspan>\n          <span data-plus=\"\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; color: oklch(0.55 0.12 60); line-height: 1;\"><\u002Fspan>\n        <\u002Fsummary>\n        <div style=\"padding: 0 0 40px 32px;\">\n          <p style=\"font-size: 15.5px; line-height: 1.8; color: oklch(0.38 0.014 60); margin: 0 0 8px; max-width: 62ch;\"><\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.7; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0 0 12px; max-width: 62ch;\">          <\u002Fp><div style=\"display: grid; grid-template-columns: 1fr; gap: 6px; padding: 20px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-size: 15.5px; margin: 0;\">Strategy, decisions and ROI<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 60ch;\">A non-technical briefing across three modules — AI strategy frameworks, decision-making under uncertainty, ROI assessment and team-building. No builds; the layer above the engineering.<\u002Fp>\n          <\u002Fdiv>\n<p><\u002Fp>\nStrategy · ROI · decision-making        <\u002Fdiv>\n      <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"beyond\" data-screen-label=\"Beyond work\" style=\"max-width: 1080px; margin: 0 auto; padding: 160px 0 0;\">\n    <div style=\"height: 1px; background: oklch(0.88 0.012 84); margin: 0 0 130px;\"><\u002Fdiv>\n    <div data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1.6fr; gap: 72px; align-items: start;\">\n      <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 21px; line-height: 1.35; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.45 0.02 60); margin: 0; text-align: center; position: sticky; top: 120px;\">Beyond work<\u002Fp>\n      <div>\n        <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 56px; margin: 0 0 56px;\">\n          <div style=\"padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0 0 10px;\">Speaking<\u002Fp>\n            <p style=\"font-size: 15.5px; line-height: 1.7; color: oklch(0.4 0.014 60); margin: 0;\">IEEE HU tech talk on acoustic sensing for disaster response, 2026. Panel on student research at the DURS Symposium.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0 0 10px;\">Writing<\u002Fp>\n            <p style=\"font-size: 15.5px; line-height: 1.7; color: oklch(0.4 0.014 60); margin: 0;\">Occasional notes on robotics tooling and why most ML demos never reach deployment.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0 0 10px;\">Volunteering<\u002Fp>\n            <p style=\"font-size: 15.5px; line-height: 1.7; color: oklch(0.4 0.014 60); margin: 0;\">Mathematics teaching with The Citizens Foundation, and peer tutoring across two years of Calculus cohorts.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0 0 10px;\">Off the clock<\u002Fp>\n            <p style=\"font-size: 15.5px; line-height: 1.7; color: oklch(0.4 0.014 60); margin: 0;\">Cricket, chess and badminton. Gardening for balance, travel for perspective.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 0 0 56px;\">\n          <figure style=\"margin: 0;\">\n          <div style=\"position: relative; aspect-ratio: 3/2; background-image: repeating-linear-gradient(135deg, oklch(0.93 0.014 84) 0 6px, oklch(0.955 0.012 84) 6px 12px); display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: oklch(0.55 0.014 60); padding: 0 10px; text-align: center;\">images/beyond-talk.jpeg<\u002Fspan>\n            <img src=\"images/beyond-talk.jpeg\" alt=\"IEEE tech talk\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;\">\n          <\u002Fdiv>\n          <figcaption style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.6; letter-spacing: 0.06em; color: oklch(0.58 0.014 60); margin: 10px 0 0;\">IEEE HU tech talk on acoustic sensing, 2026<\u002Ffigcaption>\n        <\u002Ffigure>\n          <figure style=\"margin: 0;\">\n          <div style=\"position: relative; aspect-ratio: 3/2; background-image: repeating-linear-gradient(135deg, oklch(0.93 0.014 84) 0 6px, oklch(0.955 0.012 84) 6px 12px); display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: oklch(0.55 0.014 60); padding: 0 10px; text-align: center;\">images/beyond-teaching.jpeg<\u002Fspan>\n            <img src=\"images/beyond-teaching.jpeg\" alt=\"Teaching session\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;\">\n          <\u002Fdiv>\n          <figcaption style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.6; letter-spacing: 0.06em; color: oklch(0.58 0.014 60); margin: 10px 0 0;\">Calculus peer-tutoring session<\u002Ffigcaption>\n        <\u002Ffigure>\n        <\u002Fdiv>\n        <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.014 60); margin: 0 0 18px;\">Tools<\u002Fp>\n        <p style=\"font-size: 15px; line-height: 2; color: oklch(0.42 0.014 60); margin: 0; max-width: 62ch;\">Python · PyTorch · TensorFlow · OpenCV · scikit-learn · CrewAI · LangChain · Flask · SQL · Pandas · ROS2 · NAV2 · MATLAB &amp; Simulink · Embedded C · Git · Figma · Jira<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Education\" style=\"max-width: 1080px; margin: 0 auto; padding: 160px 0 0;\">\n    <div style=\"height: 1px; background: oklch(0.88 0.012 84); margin: 0 0 130px;\"><\u002Fdiv>\n    <div data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1.6fr; gap: 72px; align-items: start;\">\n      <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 21px; line-height: 1.35; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.45 0.02 60); margin: 0; text-align: center; position: sticky; top: 120px;\">Education<\u002Fp>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"padding: 30px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <h3 style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-weight: 400; font-size: 24px; margin: 0 0 8px;\">BS Electrical Engineering<\u002Fh3>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60); margin: 0 0 14px;\">Habib University, Karachi · Aug 2022 – Jun 2026 · CGPA 3.21/4.00<\u002Fp>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.48 0.014 60); margin: 0; max-width: 60ch;\">Coursework: Introduction to Robotics, Mobile Robotics, Engineering Design and Innovation, Digital Signal Processing, Statistical Inference, Supply Chain Management, Principles of Management, Control Systems, Linear Algebra, Discrete Mathematics, Probability and Statistics, Calculus, Computer Architecture, Microcontrollers and Interfacing, Programming Fundamentals, Data Structures and Algorithms, Object-Oriented Programming, Digital Logic and Design.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 30px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <h3 style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-weight: 400; font-size: 24px; margin: 0 0 8px;\">Data Science &amp; AI Bootcamp<\u002Fh3>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60); margin: 0 0 14px;\">Atom Camp · Aug 2025 – Dec 2025<\u002Fp>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.48 0.014 60); margin: 0; max-width: 60ch;\">Intensive bootcamp covering machine learning, deep learning, and data science through hands-on projects. Built end-to-end pipelines in computer vision, data visualization, NLP, EDA, SQL queries, and AI agents.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 30px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <h3 style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-weight: 400; font-size: 24px; margin: 0 0 8px;\">IBM Product Manager Professional Certificate<\u002Fh3>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60); margin: 0 0 14px;\">Coursera (IBM) · Dec 2025 – Ongoing<\u002Fp>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.48 0.014 60); margin: 0; max-width: 60ch;\">Comprehensive program covering product strategy, development lifecycle, stakeholder collaboration, and Agile methodologies. Preparing for the AIPMM Certified Product Manager (CPM) certification.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between; gap: 28px; padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84); font-size: 15px;\">\n          <span>CAIE A-levels — Foundation Public School (AS) &amp; Highbrow College (A2) · 4 As, 1 E<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: oklch(0.58 0.014 60); white-space: nowrap;\">2018 — 2020<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between; gap: 28px; padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84); border-bottom: 1px solid oklch(0.88 0.012 84); font-size: 15px;\">\n          <span>CAIE O-levels — Sadequain Grammar School · 2 A*s, 5 As, 4 Bs<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: oklch(0.58 0.014 60); white-space: nowrap;\">2016 — 2018<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contact\" data-screen-label=\"Contact\" style=\"max-width: 1080px; margin: 0 auto; padding: 190px 0 0;\">\n    <div data-reveal=\"\">\n      <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 21px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.55 0.12 60); margin: 0 0 44px;\">Contact<\u002Fp>\n      <h2 style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-weight: 400; font-size: clamp(34px, 4.4vw, 60px); line-height: 1.14; margin: 0 0 28px; max-width: 24ch;\">Tell me what you're building.<\u002Fh2>\n      <p style=\"font-size: 16.5px; line-height: 1.8; color: oklch(0.42 0.014 60); margin: 0 0 44px; max-width: 48ch;\">Open to AI/ML engineer, machine learning engineer, and computer vision roles — full-time, on-site or remote. Available immediately.<\u002Fp>\n      <a href=\"mailto:zk08128@st.habib.edu.pk\" style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 25px; border-bottom: 1px solid oklch(0.55 0.12 60); padding-bottom: 4px;\">zk08128@st.habib.edu.pk<\u002Fa>\n      <div style=\"display: flex; gap: 32px; margin: 80px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.5 0.014 60);\">\n        <a href=\"https://github.com/zaidbkhalid\" target=\"_blank\" rel=\"noopener\">GitHub<\u002Fa>\n        <a href=\"https://www.linkedin.com/in/zbk2001/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: oklch(0.62 0.014 60); margin: 72px 0 0;\">© 2026 Zaid Bin Khalid<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const motion = this.props.motion ?? true;\n    if (!motion || !('IntersectionObserver' in window)) return;\n    const nodes = Array.from(document.querySelectorAll('[data-reveal]'));\n    nodes.forEach(n => {\n      n.style.opacity = '0';\n      n.style.transform = 'translateY(14px)';\n      n.style.transition = 'opacity 900ms cubic-bezier(.22,.61,.36,1), transform 900ms cubic-bezier(.22,.61,.36,1)';\n    });\n    const io = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        e.target.style.opacity = '1';\n        e.target.style.transform = 'none';\n        io.unobserve(e.target);\n      });\n    }, { rootMargin: '0px 0px -10% 0px', threshold: 0.03 });\n    nodes.forEach((n, i) => { n.style.transitionDelay = (Math.min(i, 3) * 90) + 'ms'; io.observe(n); });\n    this._io = io;\n    this.effects();\n  }\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    (this._cleanup || []).forEach(f => f());\n  }\n\n  componentDidUpdate() { this.effects(); }\n\n  effects() {\n    if (this._fx) return;\n    this._fx = true;\n    this._cleanup = [];\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const ochre = 'oklch(0.55 0.12 60)';\n    const add = (el) => { document.body.appendChild(el); this._cleanup.push(() => el.remove()); };\n\n    // 0. hide images that fail to load, so the labelled placeholder shows\n    Array.from(document.images).forEach(img => {\n      const hide = () => { img.style.display = 'none'; };\n      if (img.complete && img.naturalWidth === 0) hide();\n      img.addEventListener('error', hide);\n    });\n\n    // 1. paper grain\n    const grain = document.createElement('div');\n    grain.style.cssText = 'position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:0.05;mix-blend-mode:multiply;background-image:url(\"data:image/svg+xml,' +\n      encodeURIComponent('<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"180\" height=\"180\"><filter id=\"n\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.8\" numOctaves=\"4\"/><\u002Ffilter><rect width=\"180\" height=\"180\" filter=\"url(#n)\"/><\u002Fsvg>') + '\")';\n    add(grain);\n\n    // 2. reading progress hairline\n    const prog = document.createElement('div');\n    prog.style.cssText = 'position:fixed;top:0;left:0;height:2px;width:0;z-index:9999;background:' + ochre + ';transition:width 120ms linear;';\n    add(prog);\n\n    // 3. cursor light — warm pool that follows the pointer\n    let spot = null;\n    if (!reduce && window.matchMedia('(hover: hover)').matches) {\n      spot = document.createElement('div');\n      spot.style.cssText = 'position:fixed;left:0;top:0;width:620px;height:620px;margin:-310px 0 0 -310px;z-index:0;pointer-events:none;opacity:0;transition:opacity 600ms ease;background:radial-gradient(circle closest-side, oklch(0.99 0.03 84 / 0.85), transparent 70%);';\n      add(spot);\n      let tx = 0, ty = 0, cx = 0, cy = 0, raf = 0;\n      const onMove = (e) => { tx = e.clientX; ty = e.clientY; spot.style.opacity = '1'; };\n      const tick = () => { cx += (tx - cx) * 0.08; cy += (ty - cy) * 0.08; spot.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0)'; raf = requestAnimationFrame(tick); };\n      window.addEventListener('mousemove', onMove);\n      raf = requestAnimationFrame(tick);\n      this._cleanup.push(() => { window.removeEventListener('mousemove', onMove); cancelAnimationFrame(raf); });\n    }\n\n    // 4. hero name — letters settle in\n    const h1 = document.querySelector('#top h1');\n    if (h1 && !h1.dataset.split) {\n      h1.dataset.split = '1';\n      const txt = h1.textContent;\n      h1.textContent = '';\n      txt.split('').forEach((ch, i) => {\n        const sp = document.createElement('span');\n        sp.textContent = ch === ' ' ? '\\u00a0' : ch;\n        sp.style.cssText = 'display:inline-block;' + (reduce ? '' : 'opacity:0;transform:translateY(0.42em) rotate(2deg);transition:opacity 900ms cubic-bezier(.2,.7,.3,1) ' + (i * 34) + 'ms, transform 1000ms cubic-bezier(.2,.7,.3,1) ' + (i * 34) + 'ms;');\n        h1.appendChild(sp);\n      });\n      if (!reduce) requestAnimationFrame(() => requestAnimationFrame(() => {\n        h1.querySelectorAll('span').forEach(sp => { sp.style.opacity = '1'; sp.style.transform = 'none'; });\n      }));\n    }\n\n    // 5. image slots — ink wipe reveal + slow drift\n    const figs = Array.from(document.querySelectorAll('figure > div, #top [data-reveal] > div'));\n    if (!reduce) figs.forEach(f => {\n      f.style.clipPath = 'inset(0 0 100% 0)';\n      f.style.transition = 'clip-path 1100ms cubic-bezier(.16,.84,.28,1)';\n      const img = f.querySelector('img');\n      if (img) { img.style.transition = 'transform 1400ms cubic-bezier(.16,.84,.28,1)'; img.style.transform = 'scale(1.08)'; }\n    });\n    const wipe = new IntersectionObserver(es => es.forEach(e => {\n      if (!e.isIntersecting) return;\n      e.target.style.clipPath = 'inset(0 0 0 0)';\n      const img = e.target.querySelector('img');\n      if (img) img.style.transform = 'scale(1)';\n      wipe.unobserve(e.target);\n    }), { threshold: 0.15 });\n    if (!reduce) figs.forEach(f => wipe.observe(f));\n    this._cleanup.push(() => wipe.disconnect());\n\n    // 6. glance metrics count up\n    const nums = Array.from(document.querySelectorAll('#glance p')).filter(p => /^\\d+[+%]?$/.test(p.textContent.trim()));\n    const counter = new IntersectionObserver(es => es.forEach(e => {\n      if (!e.isIntersecting) return;\n      const el = e.target, raw = el.textContent.trim();\n      const target = parseInt(raw, 10), suffix = raw.replace(/[0-9]/g, '');\n      const t0 = performance.now(), dur = 1400;\n      const step = (t) => {\n        const k = Math.min(1, (t - t0) / dur);\n        const eased = 1 - Math.pow(1 - k, 3);\n        el.textContent = Math.round(target * eased) + suffix;\n        if (k < 1) requestAnimationFrame(step);\n      };\n      if (!reduce) { el.textContent = '0' + suffix; requestAnimationFrame(step); }\n      counter.unobserve(el);\n    }), { threshold: 0.6 });\n    nums.forEach(n => counter.observe(n));\n    this._cleanup.push(() => counter.disconnect());\n\n    // 7. nav follows the section you're in\n    const secs = Array.from(document.querySelectorAll('section[id]'));\n    const links = Array.from(document.querySelectorAll('header nav a'));\n    const setActive = (id) => links.forEach(a => {\n      const on = a.getAttribute('href') === '#' + id;\n      a.style.color = on ? ochre : 'oklch(0.5 0.014 60)';\n      a.style.opacity = on ? '1' : '0.75';\n    });\n    const spy = new IntersectionObserver(es => {\n      const vis = es.filter(e => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];\n      if (vis) setActive(vis.target.id);\n    }, { rootMargin: '-45% 0px -45% 0px' });\n    secs.forEach(s => spy.observe(s));\n    this._cleanup.push(() => spy.disconnect());\n\n    // 8. portrait tilts toward the cursor\n    const frame = document.querySelector('#top [data-reveal]');\n    if (frame && !reduce && window.matchMedia('(hover: hover)').matches) {\n      frame.style.transition = 'transform 500ms cubic-bezier(.2,.7,.3,1)';\n      frame.style.transformStyle = 'preserve-3d';\n      const onTilt = (e) => {\n        const r = frame.getBoundingClientRect();\n        const dx = (e.clientX - (r.left + r.width / 2)) / r.width;\n        const dy = (e.clientY - (r.top + r.height / 2)) / r.height;\n        frame.style.transform = 'perspective(900px) rotateY(' + (dx * 5).toFixed(2) + 'deg) rotateX(' + (-dy * 5).toFixed(2) + 'deg)';\n      };\n      const onLeave = () => { frame.style.transform = 'none'; };\n      window.addEventListener('mousemove', onTilt);\n      window.addEventListener('mouseout', onLeave);\n      this._cleanup.push(() => { window.removeEventListener('mousemove', onTilt); window.removeEventListener('mouseout', onLeave); });\n    }\n\n    // 9. progress + hairline rules drawing themselves\n    const rules = Array.from(document.querySelectorAll('div[style*=\"height: 1px\"][style*=\"oklch(0.88\"]'));\n    if (!reduce) rules.forEach(r => { r.style.transformOrigin = 'left center'; r.style.transform = 'scaleX(0)'; r.style.transition = 'transform 1400ms cubic-bezier(.16,.84,.28,1)'; });\n    const ruleIO = new IntersectionObserver(es => es.forEach(e => {\n      if (!e.isIntersecting) return;\n      e.target.style.transform = 'scaleX(1)';\n      ruleIO.unobserve(e.target);\n    }), { threshold: 0.5 });\n    if (!reduce) rules.forEach(r => ruleIO.observe(r));\n    this._cleanup.push(() => ruleIO.disconnect());\n\n    // 10. course progress bars fill on entry\n    const bars = Array.from(document.querySelectorAll('#learning div[style*=\"height: 3px\"] > div'));\n    bars.forEach(b => { const w = b.style.width; b.dataset.w = w; if (!reduce) { b.style.width = '0%'; b.style.transition = 'width 1500ms cubic-bezier(.16,.84,.28,1)'; } });\n    const barIO = new IntersectionObserver(es => es.forEach(e => {\n      if (!e.isIntersecting) return;\n      e.target.style.width = e.target.dataset.w;\n      barIO.unobserve(e.target);\n    }), { threshold: 0.9 });\n    bars.forEach(b => barIO.observe(b));\n    this._cleanup.push(() => barIO.disconnect());\n\n    const onScroll = () => {\n      const h = document.documentElement.scrollHeight - window.innerHeight;\n      prog.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';\n    };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    onScroll();\n    this._cleanup.push(() => window.removeEventListener('scroll', onScroll));\n  }\n\n  renderVals() { return {}; }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
