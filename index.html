  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 line-height: 1.6; color: oklch(0.46 0.014 60); margin: 0;\">ML and robotics systems built end to end, from data collection to deployment<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top: 2px solid oklch(0.55 0.12 60); padding: 18px 0 0;\">\n            <p style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 40px; line-height: 1; margin: 0 0 10px;\">94%<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.6; color: oklch(0.46 0.014 60); margin: 0;\">Best test accuracy on the acoustic crash classifier, held under noise injection<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top: 2px solid oklch(0.55 0.12 60); padding: 18px 0 0;\">\n            <p style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 40px; line-height: 1; margin: 0 0 10px;\">2<\u002Fp>\n            <p style=\"font-size: 14px; line-height: 1.6; color: oklch(0.46 0.014 60); margin: 0;\">Papers submitted — IEEE KHI-HTC 2026 and the DURS Symposium<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 56px;\">\n          <div style=\"padding: 24px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); margin: 0 0 10px;\">Modelling<\u002Fp>\n            <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.42 0.014 60); margin: 0;\">Deep learning for sequence and vision tasks — CNNs, RNN-LSTM, transformer fine-tuning. Classical baselines first, always.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 24px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); margin: 0 0 10px;\">Data<\u002Fp>\n            <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.42 0.014 60); margin: 0;\">Collecting and labelling my own datasets when none exist. Augmentation, feature extraction, and honest validation splits.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 24px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); margin: 0 0 10px;\">Deployment<\u002Fp>\n            <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.42 0.014 60); margin: 0;\">Quantization and edge inference, Flask services, ROS2 nodes. Models that run on the device they were meant for.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 24px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n            <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); margin: 0 0 10px;\">Systems<\u002Fp>\n            <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.42 0.014 60); margin: 0;\">LLM agent orchestration, retrieval pipelines, and the signal-processing background that makes sensor data legible.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin: 56px 0 0;\">\n          <figure style=\"margin: 0;\">\n          <div style=\"position: relative; aspect-ratio: 4/3; background-image: repeating-linear-gradient(135deg, oklch(0.93 0.014 84) 0 6px, oklch(0.955 0.012 84) 6px 12px); display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: oklch(0.55 0.014 60); padding: 0 10px; text-align: center;\">images/glance-training.png<\u002Fspan>\n            <img src=\"images/glance-training.png\" alt=\"Training curves\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;\">\n          <\u002Fdiv>\n          <figcaption style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.6; letter-spacing: 0.06em; color: oklch(0.58 0.014 60); margin: 10px 0 0;\">Training and validation curves — acoustic classifier<\u002Ffigcaption>\n        <\u002Ffigure>\n          <figure style=\"margin: 0;\">\n          <div style=\"position: relative; aspect-ratio: 4/3; background-image: repeating-linear-gradient(135deg, oklch(0.93 0.014 84) 0 6px, oklch(0.955 0.012 84) 6px 12px); display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: oklch(0.55 0.014 60); padding: 0 10px; text-align: center;\">images/glance-confusion.png<\u002Fspan>\n            <img src=\"images/glance-confusion.png\" alt=\"Confusion matrix\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;\">\n          <\u002Fdiv>\n          <figcaption style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.6; letter-spacing: 0.06em; color: oklch(0.58 0.014 60); margin: 10px 0 0;\">Confusion matrix across six crop disease classes<\u002Ffigcaption>\n        <\u002Ffigure>\n          <figure style=\"margin: 0;\">\n          <div style=\"position: relative; aspect-ratio: 4/3; background-image: repeating-linear-gradient(135deg, oklch(0.93 0.014 84) 0 6px, oklch(0.955 0.012 84) 6px 12px); display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: oklch(0.55 0.014 60); padding: 0 10px; text-align: center;\">images/glance-rig.jpeg<\u002Fspan>\n            <img src=\"images/glance-rig.jpeg\" alt=\"Robot test rig\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;\">\n          <\u002Fdiv>\n          <figcaption style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.6; letter-spacing: 0.06em; color: oklch(0.58 0.014 60); margin: 10px 0 0;\">Bench rig for sensor calibration<\u002Ffigcaption>\n        <\u002Ffigure>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" data-screen-label=\"About\" style=\"max-width: 1080px; margin: 0 auto; padding: 130px 0 0;\">\n    <div data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1.6fr; gap: 72px; align-items: start;\">\n      <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 21px; line-height: 1.35; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.45 0.02 60); margin: 0; text-align: center; position: sticky; top: 120px;\">About<\u002Fp>\n      <div>\n        <p style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 23px; line-height: 1.5; color: oklch(0.3 0.014 60); margin: 0 0 32px; max-width: 42ch; text-wrap: pretty;\">I'm looking for AI/ML engineering work where the model has to survive contact with real data.<\u002Fp>\n        <p style=\"font-size: 17px; line-height: 1.85; color: oklch(0.34 0.014 60); margin: 0 0 26px; max-width: 58ch;\">I'm an Electrical Engineering graduate with a deep interest in AI, Robotics, and Product Management. I love building things that actually solve real-world problems, and I enjoy thinking in systems and using design thinking to make sure what I build is not just technically cool, but also useful and usable.<\u002Fp>\n        <p style=\"font-size: 17px; line-height: 1.85; color: oklch(0.34 0.014 60); margin: 0 0 26px; max-width: 58ch;\">My experience sits at the intersection of intelligent algorithms, physical systems, and user-centered product development — bridging theory with practical, deployable solutions.<\u002Fp>\n t: 0; width: 100%; height: 100%; object-fit: cover;\">\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1.25fr; gap: 72px; align-items: start; margin: 0 0 130px;\">\n      <div>\n        <h3 style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.2; margin: 0 0 20px;\">Autonomous Rescue Navigation<\u002Fh3>\n        <p style=\"font-size: 16px; line-height: 1.8; color: oklch(0.4 0.014 60); margin: 0 0 24px; max-width: 36ch;\">Differential-drive rescue robot using LiDAR and sound triangulation with graph-based SLAM for unknown disaster environments.<\u002Fp>\n        <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0;\">SLAM · NAV2 · LiDAR<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position: relative; aspect-ratio: 16/10; background-image: repeating-linear-gradient(135deg, oklch(0.93 0.014 84) 0 6px, oklch(0.955 0.012 84) 6px 12px); display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: oklch(0.55 0.014 60);\">images/MR.png<\u002Fspan>\n        <img src=\"images/MR.png\" alt=\"Autonomous rescue robot\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;\">\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1.25fr; gap: 72px; align-items: start; margin: 0 0 130px;\">\n      <div>\n        <h3 style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.2; margin: 0 0 20px;\">4-DOF Robotic Arm for Pick &amp; Place<\u002Fh3>\n        <p style=\"font-size: 16px; line-height: 1.8; color: oklch(0.4 0.014 60); margin: 0 0 24px; max-width: 36ch;\">Autonomous pick-and-place with 80%+ accuracy via camera-based color cube detection and optimized inverse kinematics.<\u002Fp>\n        <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.58 0.014 60); margin: 0;\">Kinematics · IK · Robotics<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position: relative; aspect-ratio: 16/10; background-image: repeating-linear-gradient(135deg, oklch(0.93 0.014 84) 0 6px, oklch(0.955 0.012 84) 6px 12px); display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: oklch(0.55 0.014 60);\">images/Robotic%20Arm.png<\u002Fspan>\n        <img src=\"images/Robotic%20Arm.png\" alt=\"4-DOF robotic arm\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;\">\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <div data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1.6fr; gap: 72px; align-items: start;\">\n      <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 21px; line-height: 1.35; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.45 0.02 60); margin: 0; text-align: center; position: sticky; top: 120px;\">Also built<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 56px;\">\n        <div style=\"padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <p style=\"font-size: 16.5px; margin: 0 0 8px;\">Maze Solving Mobile Robot<\u002Fp>\n          <p style=\"font-size: 14.5px; line-height: 1.7; color: oklch(0.46 0.014 60); margin: 0 0 12px;\">Tiva C-based differential drive robot with IR/ultrasonic sensors and PID control for maze navigation and obstacle avoidance.<\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.6 0.014 60); margin: 0;\">Embedded C · PID · Sensors<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <p style=\"font-size: 16.5px; margin: 0 0 8px;\">Dual-Copter Control System<\u002Fp>\n          <p style=\"font-size: 14.5px; line-height: 1.7; color: oklch(0.46 0.014 60); margin: 0 0 12px;\">Full mathematical model and PID control loop for a fixed-axis dual-copter, achieving transient stability with minimal oscillation.<\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.6 0.014 60); margin: 0;\">Control Systems · Simulation<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <p style=\"font-size: 16.5px; margin: 0 0 8px;\">Real Estate Market Analysis (EDA)<\u002Fp>\n          <p style=\"font-size: 14.5px; line-height: 1.7; color: oklch(0.46 0.014 60); margin: 0 0 12px;\">Comprehensive EDA on Zameen.com listings, identifying pricing drivers and regional trends to extract actionable investment insights.<\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.6 0.014 60); margin: 0;\">Data Viz · Pandas · Seaborn<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <p style=\"font-size: 16.5px; margin: 0 0 8px;\">IMDB Sentiment Analysis Engine<\u002Fp>\n          <p style=\"font-size: 14.5px; line-height: 1.7; color: oklch(0.46 0.014 60); margin: 0 0 12px;\">Sentiment classification for 50k+ reviews using N-gram vectorization and Naive Bayes with optimized preprocessing pipeline.<\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.6 0.014 60); margin: 0;\">NLP · Tokenization · ML<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84); border-bottom: 1px solid oklch(0.88 0.012 84);\">\n          <p style=\"font-size: 16.5px; margin: 0 0 8px;\">Hospital Management Database<\u002Fp>\n          <p style=\"font-size: 14.5px; line-height: 1.7; color: oklch(0.46 0.014 60); margin: 0 0 12px;\">Normalized relational database for hospital operations with optimized SQL workloads using CTEs and Window Functions.<\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.6 0.014 60); margin: 0;\">SQL · ERD · Optimization<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 26px 0; border-top: 1px solid oklch(0.88 0.012 84); border-bottom: 1px solid oklch(0.88 0.012 84);\">\n          <p style=\"font-size: 16.5px; margin: 0 0 8px;\">Engineering Design &amp; Innovation<\u002Fp>\n          <p style=\"font-size: 14.5px; line-height: 1.7; color: oklch(0.46 0.014 60); margin: 0 0 12px;\">Applied systems engineering to study Dawlance's microwave assembly bottleneck and designed an autonomous robotic solution concept.<\u002Fp>\n          <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.6 0.014 60); margin: 0;\">Systems Eng · Robotics · Dawlance<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section id=\"aiml\" data-screen-label=\"AI and ML\" style=\"max-width: 1080px; margin: 0 auto; padding: 160px 0 0;\">\n    <div style=\"height: 1px; background: oklch(0.88 0.012 84); margin: 0 0 130px;\"><\u002Fdiv>\n    <div data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1.6fr; gap: 72px; align-items: start;\">\n      <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 21px; line-height: 1.35; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.45 0.02 60); margin: 0; text-align: center; position: sticky; top: 120px;\">AI &amp; Machine Learning<\u002Fp>\n      <div>\n        <p style=\"font-family: 'Libre Caslon Display', Georgia, serif; font-size: 23px; line-height: 1.5; color: oklch(0.34 0.014 60); margin: 0 0 40px; max-width: 40ch; text-wrap: pretty;\">Models are only interesting once they survive messy, real-world input. Most of these started as a dataset nobody had cleaned yet.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: 1.25fr 1fr; gap: 24px; margin: 0 0 24px;\">\n          <figure style=\"margin: 0;\">\n          <div style=\"position: relative; aspect-ratio: 16/10; background-image: repeating-linear-gradient(135deg, oklch(0.93 0.014 84) 0 6px, oklch(0.955 0.012 84) 6px 12px); display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: oklch(0.55 0.014 60); padding: 0 10px; text-align: center;\">images/aiml-detection.jpeg<\u002Fspan>\n            <img src=\"images/aiml-detection.jpeg\" alt=\"Detection output\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;\">\n          <\u002Fdiv>\n          <figcaption style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.6; letter-spacing: 0.06em; color: oklch(0.58 0.014 60); margin: 10px 0 0;\">YOLOv8 inference on a cluttered test scene<\u002Ffigcaption>\n        <\u002Ffigure>\n          <figure style=\"margin: 0;\">\n          <div style=\"position: relative; aspect-ratio: 16/10; background-image: repeating-linear-gradient(135deg, oklch(0.93 0.014 84) 0 6px, oklch(0.955 0.012 84) 6px 12px); display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: oklch(0.55 0.014 60); padding: 0 10px; text-align: center;\">images/aiml-mfcc.png<\u002Fspan>\n            <img src=\"images/aiml-mfcc.png\" alt=\"MFCC features\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;\">\n          <\u002Fdiv>\n          <figcaption style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.6; letter-spacing: 0.06em; color: oklch(0.58 0.014 60); margin: 10px 0 0;\">MFCC feature bank fed to the LSTM<\u002Ffigcaption>\n        <\u002Ffigure>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"padding: 28px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <div style=\"display: flex; justify-content: space-between; gap: 28px; margin: 0 0 10px;\">\n            <p style=\"font-size: 17px; margin: 0;\">Acoustic Event Classifier — LSTM<\u002Fp>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); white-space: nowrap; padding-top: 3px;\">Python · PyTorch<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 56ch;\">Sequence-aware classifier for urban crash audio. MFCC feature extraction feeding a stacked RNN-LSTM, benchmarked against SVM and Naive Bayes baselines. Held above 90% accuracy under noise injection and SNR variation.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 28px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <div style=\"display: flex; justify-content: space-between; gap: 28px; margin: 0 0 10px;\">\n            <p style=\"font-size: 17px; margin: 0;\">Crop Disease Detection — Transfer Learning<\u002Fp>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); white-space: nowrap; padding-top: 3px;\">TensorFlow · TFLite<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 56ch;\">Fine-tuned an EfficientNet backbone on 12k field-captured leaf images across six disease classes, reaching 96% top-1 on a held-out farm. Quantized to TFLite for offline inference at 40ms per frame on a mid-range Android phone.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 28px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <div style=\"display: flex; justify-content: space-between; gap: 28px; margin: 0 0 10px;\">\n            <p style=\"font-size: 17px; margin: 0;\">Urdu–English Code-Switch Sentiment<\u002Fp>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); white-space: nowrap; padding-top: 3px;\">HuggingFace · NLP<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 56ch;\">Fine-tuned a multilingual transformer on scraped Roman-Urdu social posts, handling code-switched sentences that break monolingual tokenizers. Custom normalization pipeline for inconsistent transliteration lifted macro-F1 from 0.71 to 0.84.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 28px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <div style=\"display: flex; justify-content: space-between; gap: 28px; margin: 0 0 10px;\">\n            <p style=\"font-size: 17px; margin: 0;\">Load Forecasting for Grid Anomaly Detection<\u002Fp>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); white-space: nowrap; padding-top: 3px;\">Time Series · Keras<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 56ch;\">Short-term demand forecasting on smart-meter time series with an LSTM encoder, using forecast residuals as an anomaly signal for transmission-line faults — 0.91 precision at 0.88 recall on labelled fault windows. Grew out of my Summer Tehqiq smart grid research.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 28px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <div style=\"display: flex; justify-content: space-between; gap: 28px; margin: 0 0 10px;\">\n            <p style=\"font-size: 17px; margin: 0;\">Retrieval-Augmented Document Assistant<\u002Fp>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); white-space: nowrap; padding-top: 3px;\">LangChain · FAISS<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 56ch;\">Local RAG pipeline over a private PDF corpus — chunking, embedding, and a re-ranking step before generation. A re-ranking step cut unsupported citations by roughly two thirds on an internal eval set of 200 questions.<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"building\" data-screen-label=\"In progress\" style=\"max-width: 1080px; margin: 0 auto; padding: 160px 0 0;\">\n    <div style=\"height: 1px; background: oklch(0.88 0.012 84); margin: 0 0 130px;\"><\u002Fdiv>\n    <div data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1.6fr; gap: 72px; align-items: start;\">\n      <p style=\"font-family: 'JetBrains Mono', monospace; font-size: 21px; line-height: 1.35; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.45 0.02 60); margin: 0; text-align: center; position: sticky; top: 120px;\">Currently building<\u002Fp>\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"padding: 28px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <div style=\"display: flex; justify-content: space-between; gap: 28px; margin: 0 0 10px;\">\n            <p style=\"font-size: 17px; margin: 0;\">Multi-Agent Marketing Orchestrator — v2<\u002Fp>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); white-space: nowrap; padding-top: 3px;\">In progress · 60%<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 56ch;\">Extending the Trend Scout agent into a supervised multi-agent setup: separate research, strategy, and copy agents with a critic pass before anything reaches the user. Adding brand-voice memory per client.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 28px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <div style=\"display: flex; justify-content: space-between; gap: 28px; margin: 0 0 10px;\">\n            <p style=\"font-size: 17px; margin: 0;\">Vision-Guided Warehouse Pick Assistant<\u002Fp>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); white-space: nowrap; padding-top: 3px;\">In progress · 40%<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 56ch;\">Pairing the YOLOv8 detection pipeline with the 4-DOF arm for bin-picking on cluttered surfaces. Currently working on grasp-point estimation from depth rather than centroid guessing.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 28px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <div style=\"display: flex; justify-content: space-between; gap: 28px; margin: 0 0 10px;\">\n            <p style=\"font-size: 17px; margin: 0;\">Rescue Robot — Field Trials<\u002Fp>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); white-space: nowrap; padding-top: 3px;\">In progress · 30%<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 56ch;\">Taking the SLAM rescue platform out of simulation. Rebuilding the chassis for rubble traversal and validating sound triangulation with real reverberation instead of synthetic noise.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 28px 0; border-top: 1px solid oklch(0.88 0.012 84);\">\n          <div style=\"display: flex; justify-content: space-between; gap: 28px; margin: 0 0 10px;\">\n            <p style=\"font-size: 17px; margin: 0;\">Open Dataset: Karachi Urban Audio<\u002Fp>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.55 0.12 60); white-space: nowrap; padding-top: 3px;\">Collecting data<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.75; color: oklch(0.46 0.014 60); margin: 0; max-width: 56ch;\">Collecting and labelling a public dataset of city soundscapes — traffic, crashes, sirens, construction — so acoustic models can be trained on South Asian conditions rather than Western corpora.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"In progress visuals\" style=\"max-width: 1080px; margin: 0 auto; padding: 90px 0 0;\">\n    <div data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px;\">\n      <figure style=\"margin: 0;\">\n          <div style=\"position: relative; aspect-ratio: 16/11; background-image: r
